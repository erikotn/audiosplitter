<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioSplitter - Local Audio Segmenter</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- FileSaver.js (Required for ZIP download) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- JSZip for zipping files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#09090b', 800: '#18181b', 700: '#27272a' },
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white h-screen overflow-hidden selection:bg-brand-500 selection:text-white">
    
    <!-- Grid Background -->
    <div class="fixed inset-0 z-0 opacity-20 pointer-events-none" 
         style="background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px); background-size: 40px 40px;">
    </div>

    <div id="root" class="relative z-10 h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Icons = {
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            FileAudio: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19c0-1.7-1.3-3-3-3h-5c-1.7 0-3 1.3-3 3"/><path d="M17.5 22a16.5 16.5 0 0 0-11 0"/><path d="M8 10h8"/><path d="M8 6h8"/><path d="M10 2v4"/><path d="M14 2v4"/></svg>,
            Scissors: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Loader: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Hash: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>,
            Archive: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        };

        // --- Audio Helpers ---
        
        function writeWavHeader(sampleRate, numChannels, dataLength) {
            const buffer = new ArrayBuffer(44);
            const view = new DataView(buffer);
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true); // 16-bit
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true); // 16-bit
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);
            return buffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Convert Float32 to Int16 PCM
        function floatTo16BitPCM(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return output;
        }

        function interleave(inputL, inputR) {
            const length = inputL.length + inputR.length;
            const result = new Float32Array(length);
            let index = 0;
            let inputIndex = 0;
            while (index < length) {
                result[index++] = inputL[inputIndex];
                result[index++] = inputR[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function App() {
            const [file, setFile] = useState(null);
            const [audioBuffer, setAudioBuffer] = useState(null);
            const [duration, setDuration] = useState(0);
            
            // Settings
            const [splitMode, setSplitMode] = useState('count'); // 'count' or 'length'
            const [parts, setParts] = useState(2);
            const [chunkLength, setChunkLength] = useState(10); // Minutes
            const [optimize, setOptimize] = useState(true); // Default to speech optimize
            
            const [isProcessing, setIsProcessing] = useState(false);
            const [progress, setProgress] = useState(0);
            const [segments, setSegments] = useState([]);
            const [error, setError] = useState(null);
            const [isZipping, setIsZipping] = useState(false);

            useEffect(() => {
                if (file) handleDecodeAudio(file);
                else {
                    setAudioBuffer(null);
                    setDuration(0);
                    setSegments([]);
                    setError(null);
                }
            }, [file]);

            const handleFileSelect = (e) => {
                if (e.target.files?.[0]) setFile(e.target.files[0]);
            };

            const handleDecodeAudio = async (fileBlob) => {
                setIsProcessing(true);
                setProgress(10);
                setError(null);
                try {
                    const arrayBuffer = await fileBlob.arrayBuffer();
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    setProgress(40);
                    const decodedBuffer = await audioContext.decodeAudioData(arrayBuffer);
                    setAudioBuffer(decodedBuffer);
                    setDuration(decodedBuffer.duration);
                    setProgress(100);
                    setIsProcessing(false);
                } catch (err) {
                    console.error(err);
                    setError("Could not decode audio.");
                    setIsProcessing(false);
                }
            };

            const resampleBuffer = async (sourceBuffer, targetRate) => {
                const offlineCtx = new OfflineAudioContext(1, sourceBuffer.duration * targetRate, targetRate);
                const source = offlineCtx.createBufferSource();
                source.buffer = sourceBuffer;
                source.connect(offlineCtx.destination);
                source.start(0);
                return await offlineCtx.startRendering();
            };

            const handleSplit = async () => {
                if (!audioBuffer) return;
                setIsProcessing(true);
                setProgress(0);
                setSegments([]);
                await new Promise(r => setTimeout(r, 100));

                let workBuffer = audioBuffer;

                // 1. Optimization Step (Resample to 16kHz Mono if requested)
                if (optimize) {
                    try {
                        workBuffer = await resampleBuffer(audioBuffer, 16000);
                    } catch (e) {
                        console.warn("Resampling failed, using original", e);
                    }
                }

                // 2. Calculate Split Points
                const totalSamples = workBuffer.length;
                const sampleRate = workBuffer.sampleRate;
                const channels = workBuffer.numberOfChannels;
                let splitPoints = []; // Array of {start, end} in samples

                if (splitMode === 'count') {
                    const samplesPerSegment = Math.floor(totalSamples / parts);
                    for (let i = 0; i < parts; i++) {
                        splitPoints.push({
                            start: i * samplesPerSegment,
                            end: i === parts - 1 ? totalSamples : (i + 1) * samplesPerSegment
                        });
                    }
                } else {
                    // Split by Length (Minutes)
                    const samplesPerChunk = chunkLength * 60 * sampleRate;
                    let current = 0;
                    while (current < totalSamples) {
                        splitPoints.push({
                            start: current,
                            end: Math.min(current + samplesPerChunk, totalSamples)
                        });
                        current += samplesPerChunk;
                    }
                }

                const newSegments = [];

                // 3. Process Segments
                for (let i = 0; i < splitPoints.length; i++) {
                    const { start, end } = splitPoints[i];
                    const length = end - start;

                    let finalBuffer;
                    const left = workBuffer.getChannelData(0).slice(start, end);

                    if (channels === 2) {
                        const right = workBuffer.getChannelData(1).slice(start, end);
                        finalBuffer = interleave(left, right);
                    } else {
                        finalBuffer = left;
                    }

                    // Convert to PCM16
                    const pcmData = floatTo16BitPCM(finalBuffer);
                    const wavHeader = writeWavHeader(sampleRate, channels, pcmData.byteLength);
                    
                    const blob = new Blob([wavHeader, pcmData], { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    
                    newSegments.push({
                        id: i,
                        url: url,
                        blob: blob, // Store blob for zip
                        name: `${file.name.split('.')[0]}_part${i+1}.wav`,
                        start: formatTime(start / sampleRate),
                        end: formatTime(end / sampleRate),
                        size: (blob.size / (1024 * 1024)).toFixed(2) // Size in MB
                    });

                    setProgress(Math.round(((i + 1) / splitPoints.length) * 100));
                    await new Promise(r => setTimeout(r, 20));
                }

                setSegments(newSegments);
                setIsProcessing(false);
            };

            const handleDownloadZip = async () => {
                if (segments.length === 0) return;
                setIsZipping(true);
                
                try {
                    const zip = new JSZip();
                    const folderName = file.name.split('.')[0] + "_segments";
                    const folder = zip.folder(folderName);
                    
                    segments.forEach(seg => {
                        folder.file(seg.name, seg.blob);
                    });
                    
                    const content = await zip.generateAsync({ type: "blob" });
                    saveAs(content, folderName + ".zip");
                } catch (e) {
                    console.error("Zip error", e);
                    setError("Failed to create zip file.");
                }
                
                setIsZipping(false);
            };

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="flex flex-col h-screen items-center justify-center p-4">
                    <div className="glass-panel w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="p-6 border-b border-white/10 flex items-center gap-3 bg-gradient-to-r from-brand-600/20 to-transparent">
                            <div className="bg-brand-500 p-2 rounded-lg"><Icons.Scissors className="text-white" /></div>
                            <div>
                                <h1 className="text-xl font-bold text-white">AudioSplitter</h1>
                                <p className="text-xs text-gray-400">Prepare audio for LLMs (Whisper, Gemini, etc)</p>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 space-y-8">
                            {!file ? (
                                <label className="border-2 border-dashed border-gray-700 hover:border-brand-500 hover:bg-white/5 transition-all rounded-xl h-48 flex flex-col items-center justify-center cursor-pointer group">
                                    <div className="p-4 bg-gray-800 rounded-full mb-3 group-hover:scale-110 transition-transform">
                                        <Icons.Upload className="text-gray-400 group-hover:text-white" />
                                    </div>
                                    <span className="font-medium text-gray-300">Click to upload Audio</span>
                                    <span className="text-xs text-gray-500 mt-1">MP3, WAV, M4A supported</span>
                                    <input type="file" accept="audio/*" onChange={handleFileSelect} className="hidden" />
                                </label>
                            ) : (
                                <div className="bg-dark-800 border border-white/5 rounded-xl p-4 flex items-center gap-4">
                                    <div className="p-3 bg-brand-900/50 text-brand-400 rounded-lg"><Icons.FileAudio /></div>
                                    <div className="flex-1 min-w-0">
                                        <h3 className="font-medium text-white truncate">{file.name}</h3>
                                        <p className="text-xs text-gray-400">
                                            {duration > 0 ? formatTime(duration) : 'Loading...'} • {(file.size / (1024*1024)).toFixed(2)} MB
                                        </p>
                                    </div>
                                    <button onClick={() => setFile(null)} className="p-2 hover:bg-white/10 rounded-full text-gray-400 hover:text-white"><Icons.X /></button>
                                </div>
                            )}

                            {error && <div className="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-lg text-sm">{error}</div>}

                            {file && audioBuffer && (
                                <div className="space-y-6 animate-fade-in">
                                    
                                    {/* Split Mode Toggle */}
                                    <div className="flex bg-dark-900 p-1 rounded-lg border border-white/5">
                                        <button onClick={() => setSplitMode('count')} className={`flex-1 py-2 text-sm font-medium rounded-md flex items-center justify-center gap-2 transition-all ${splitMode === 'count' ? 'bg-dark-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}>
                                            <Icons.Hash size={16} /> By Parts
                                        </button>
                                        <button onClick={() => setSplitMode('length')} className={`flex-1 py-2 text-sm font-medium rounded-md flex items-center justify-center gap-2 transition-all ${splitMode === 'length' ? 'bg-dark-700 text-white shadow' : 'text-gray-500 hover:text-gray-300'}`}>
                                            <Icons.Clock size={16} /> By Length
                                        </button>
                                    </div>

                                    {/* Controls */}
                                    <div>
                                        {splitMode === 'count' ? (
                                            <div className="space-y-2">
                                                <div className="flex justify-between text-sm text-gray-400"><span>Number of Parts</span><span>{parts}</span></div>
                                                <input type="range" min="2" max="20" step="1" value={parts} onChange={(e) => setParts(Number(e.target.value))} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-brand-500"/>
                                                <p className="text-xs text-gray-500 text-right">~{formatTime(duration / parts)} per segment</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-2">
                                                <label className="block text-sm text-gray-400">Segment Length (minutes)</label>
                                                <div className="flex items-center gap-2">
                                                    <input type="number" min="1" value={chunkLength} onChange={(e) => setChunkLength(Number(e.target.value))} className="bg-dark-900 border border-gray-700 rounded-lg px-3 py-2 text-white w-full focus:border-brand-500 outline-none" />
                                                    <span className="text-gray-500 text-sm">min</span>
                                                </div>
                                                <p className="text-xs text-gray-500 text-right">Will result in ~{Math.ceil(duration / (chunkLength * 60))} segments</p>
                                            </div>
                                        )}
                                    </div>

                                    {/* Optimization Toggle */}
                                    <label className="flex items-start gap-3 p-4 border border-white/10 rounded-xl bg-white/5 cursor-pointer hover:bg-white/10 transition-colors">
                                        <input type="checkbox" checked={optimize} onChange={(e) => setOptimize(e.target.checked)} className="mt-1 w-4 h-4 bg-gray-800 border-gray-600 rounded accent-brand-500"/>
                                        <div>
                                            <span className="block text-sm font-bold text-white">Optimize for Speech (Recommended)</span>
                                            <span className="block text-xs text-gray-400 mt-1">Converts to 16kHz Mono WAV. Reduces file size by ~80% while keeping speech perfect for AI.</span>
                                        </div>
                                    </label>

                                    <button onClick={handleSplit} disabled={isProcessing} className="w-full py-4 bg-brand-600 hover:bg-brand-500 disabled:bg-gray-700 disabled:cursor-not-allowed rounded-xl font-bold text-white shadow-lg shadow-brand-900/20 transition-all flex items-center justify-center gap-2">
                                        {isProcessing ? <><Icons.Loader /> Processing {progress}%</> : <><Icons.Scissors /> Split Audio</>}
                                    </button>
                                </div>
                            )}

                            {segments.length > 0 && (
                                <div className="space-y-3 pt-4 border-t border-white/10">
                                    <div className="flex items-center justify-between mb-2">
                                        <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider">Result Segments</h3>
                                        <button 
                                            onClick={handleDownloadZip}
                                            disabled={isZipping}
                                            className="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg flex items-center gap-2 transition-colors"
                                        >
                                            {isZipping ? <Icons.Loader size={14} /> : <Icons.Archive size={14} />}
                                            Download All (ZIP)
                                        </button>
                                    </div>
                                    {segments.map((seg) => (
                                        <div key={seg.id} className="flex items-center justify-between bg-dark-800 p-4 rounded-xl border border-white/5 hover:border-brand-500/50 transition-colors">
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <p className="font-medium text-white">Part {seg.id + 1}</p>
                                                    <span className="text-[10px] bg-brand-900 text-brand-200 px-1.5 py-0.5 rounded">{seg.size} MB</span>
                                                </div>
                                                <p className="text-xs text-gray-500 font-mono mt-0.5">{seg.start} - {seg.end}</p>
                                            </div>
                                            <a href={seg.url} download={seg.name} className="bg-white text-black px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-200 flex items-center gap-2"><Icons.Download size={16} /> Save</a>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
